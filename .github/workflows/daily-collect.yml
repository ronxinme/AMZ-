name: Amazon Daily Collect
# 每天定时采集（下方为 UTC 时间，北京时间换算请减 8 小时）
# 北京时间 09:00 → '0 1 * * *'   北京时间 17:00 → '0 9 * * *'
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:      # 允许在网页上手动点「Run workflow」立即跑一次

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 执行采集
        env:
          SCRAPER_MODE: ${{ secrets.SCRAPER_MODE || 'direct' }}
          SCRAPER_KEY: ${{ secrets.SCRAPER_KEY }}
          INTERVAL_MS: '8000'
        run: node scripts/collect.mjs

      - name: 保存数据到仓库
        run: |
          git config user.name "amazon-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --quiet && git diff --staged --quiet; then
            echo "本次无数据变化，跳过提交"
          else
            git commit -m "每日采集更新 $(date -u +'%Y-%m-%d')"
            git push
          fi
